<app-background>
    <div class="d-flex flex-column align-items-center w-100">
        <h2 class="mb-5">Recupera tu contraseña</h2>

        <form class="d-flex flex-column align-items-center" [formGroup]="emailForm" (ngSubmit)="onSubmit()">
            <!-- Email -->
            <div class="input-w">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" class="form-control" formControlName="email" placeholder="Email"
                    [class.is-invalid]="emailForm.controls['email'].invalid && emailForm.controls['email'].touched" />

                <!-- Alertas para el email -->
                <div *ngIf="emailForm.controls['email'].invalid && emailForm.controls['email'].touched"
                    class="invalid-feedback d-block">
                    <div *ngIf="emailForm.controls['email'].errors?.['required']" class="required-text">
                        El email es requerido.
                    </div>
                    <div *ngIf="emailForm.controls['email'].errors?.['email']" class="required-text">
                        Ingresa un email válido.
                    </div>
                </div>
            </div>
            <app-primary-btn buttonText="Recuperar" [disabled]="emailForm.invalid"
                (submit)="onSubmit()"></app-primary-btn>
        </form>

        <span class="mb-3">ó</span>
        <app-google-btn></app-google-btn>
        <span class="m-3">¿No tienes una cuenta? <span class="required" style="cursor: pointer;"
                (click)="navigateToRegister()">Regístrate</span></span>
    </div>
</app-background>
