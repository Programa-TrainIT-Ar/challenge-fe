<app-background>
    <div class="d-flex flex-column align-items-center w-100">
        <h2 class="mb-5">Bienvenido nuevamente</h2>

        <form class="d-flex flex-column align-items-center" [formGroup]="loginForm" >
            <!-- Email -->
            <div class="input-w">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" class="form-control" formControlName="email" placeholder="Email"
                    [class.is-invalid]="f['email'].invalid && f['email'].touched" />

                <!-- Alertas para el email -->
                <div *ngIf="f['email'].invalid && f['email'].touched" class="invalid-feedback d-block">
                    <div *ngIf="f['email'].errors?.['required']" class="required-text">
                        El email es requerido.
                    </div>
                    <div *ngIf="f['email'].errors?.['email']" class="required-text">
                        Ingresa un email válido.
                    </div>
                </div>
            </div>
            <!-- Contraseña -->
            <div class="input-w">
                <label for="password">Contraseña <span class="required">*</span></label>
                <input type="password" class="form-control" formControlName="password" placeholder="Contraseña"
                    [class.is-invalid]="f['password'].invalid && f['password'].touched" />

                <!-- Alertas para la contraseña -->
                <div *ngIf="f['password'].invalid && f['password'].touched" class="invalid-feedback d-block">
                    <div *ngIf="f['password'].errors?.['required']" class="required-text">
                        La contraseña es requerida.
                    </div>
                </div>
            </div>
            <!-- Botón de inicio de sesión -->
            <app-primary-btn buttonText="Iniciar sesión" (submit)="loginLocal()" [disabled]="loginForm.invalid">
            </app-primary-btn>
        </form>

        <span class="m-3">¿Olvidaste tu contraseña? <span class="required" style="cursor: pointer;"
                (click)="forgotPassword()">Recuperala aquí</span></span>
        <span class="m-4">ó</span>
        <app-google-btn buttonText="Continuar con Google">
        </app-google-btn>
        <span class="m-4">¿No tienes una cuenta? <span class="required" style="cursor: pointer;"
                (click)="navigateToRegister()">Regístrate</span></span>
    </div>
</app-background>
