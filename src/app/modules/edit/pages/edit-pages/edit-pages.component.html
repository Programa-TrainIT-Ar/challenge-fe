<div class="body">
  <div class="title">
    <a class="leave" (click)="close.emit()">
      <i class="fa-solid fa-circle-chevron-left"></i> volver al listado
    </a>
    <div>
      <h1>{{ selectNameForm.value.name }}</h1>
    </div>
    <div class="empty-space"></div>
  </div>

  <div class="content-1">
    <app-header-page></app-header-page>

    <div [formGroup]="selectNameForm">
      <div formArrayName="questions" id="question-container">
        <div
          *ngFor="
            let question of paginatedQuestions;
            let i = index;
            trackBy: trackByFn
          "
          [formGroupName]="i"
          class="question-container">
          <div class="question-header">
            <!-- <span class="question-number"
              >Pregunta {{ currentPage * questionsPerPage + i + 1 }}</span
            > -->
          </div>

          <div class="text-question">
            <div>{{ question.get('text').value }}</div>
            <button class="edit-button">
              <i class="fas fa-edit"></i>
            </button>
          </div>

          <!-- Opciones para preguntas de tipo 'true_false' -->
          <div
            *ngIf="question.get('type').value === 'true_false'"
            class="option-row">
            <div class="option-item">
              <span>
                <input
                  type="radio"
                  name="correct_option_{{ i }}"
                  [checked]="
                    question.get('correct_option').value === 'Verdadero'
                  "
                  (change)="selectCorrectOption(i, 'Verdadero')" />
                <label class="option-label">Verdadero</label>
              </span>
            </div>
            <div class="option-item">
              <span>
                <input
                  type="radio"
                  name="correct_option_{{ i }}"
                  [checked]="question.get('correct_option').value === 'Falso'"
                  (change)="selectCorrectOption(i, 'Falso')" />
                <label class="option-label">Falso</label>
              </span>
            </div>
          </div>

          <!-- Opciones para preguntas de tipo 'multiple_choice' o 'simple_choice' -->
          <div
            *ngIf="
              question.get('type').value === 'multiple_choice' ||
              question.get('type').value === 'simple_choice'
            "
            class="option-row">
            <div formArrayName="options">
              <div
                *ngFor="
                  let option of question.get('options').controls;
                  let j = index
                "
                [formGroupName]="j"
                class="option-item">
                <span>
                  <input
                    [type]="
                      question.get('type').value === 'multiple_choice'
                        ? 'checkbox'
                        : 'radio'
                    "
                    name="correct_option_{{ i }}"
                    [checked]="option.get('selected').value"
                    (change)="handleOptionSelection(i, j, $event)" />
                </span>
                <span>
                  <label class="option-label">{{
                    option.get('text').value
                  }}</label>
                </span>
                <!-- <span *ngIf="option.get('selected').value">
                  <i class="fa-solid fa-check"></i>
                </span> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="pagination-container" *ngIf="totalPages > 1">
      <div class="pagination-controls">
        <button
          class="pagination-button"
          (click)="prevPage()"
          [disabled]="currentPage === 0"
          [class.disabled]="currentPage === 0">
          atras
        </button>

        <div class="page-numbers">
          <!-- Primera página -->
          <button
            *ngIf="showFirstPage"
            class="page-number"
            (click)="goToPage(0)"
            [class.active]="currentPage === 0">
            .
          </button>

          <!-- Ellipsis inicial -->
          <span *ngIf="showFirstPage" class="ellipsis">...</span>

          <!-- Páginas visibles -->
          <button
            *ngFor="let page of visiblePages"
            class="page-number"
            (click)="goToPage(page)"
            [class.active]="currentPage === page">
            .
          </button>

          <!-- Ellipsis final -->
          <span *ngIf="showLastPage" class="ellipsis">...</span>

          <!-- Última página -->
          <button
            *ngIf="showLastPage"
            class="page-number"
            (click)="goToPage(totalPages - 1)"
            [class.active]="currentPage === totalPages - 1">
            .
          </button>
        </div>
        <button *ngIf="currentPage >= totalPages - 1"
        (click)="createQuiz()" 
        class="pagination-button">
          Guardar
        </button>

        <button *ngIf="currentPage < totalPages - 1"
          class="pagination-button"
          (click)="nextPage()"
          [disabled]="currentPage >= totalPages - 1"
          [class.disabled]="currentPage >= totalPages - 1">
          siguiente
        </button>
      </div>

      <!-- <div class="page-info">
        Página {{ currentPage + 1 }} de {{ totalPages }}
      </div> -->
    </div>
  </div>
</div>
