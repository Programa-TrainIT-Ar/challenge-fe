<div [ngClass]="extended ? 'sidebar-container-extended' : 'sidebar-container'">
  <!-- Sidebar -->
  <div>
    <img 
    [ngClass]="extended ? 'side-img-extended' : 'side-img'" 
    src="assets/layout/images/logo.svg" alt="logo" />
  </div>

  <div class="sidebar-btns-container">
    <div class="gestion-btns">
      
      @for (item of sidebarItems; track $index) {
        <button 
        [ngClass]=" extended ? 'sidebar-btns-extended' : 'sidebar-btns'"
        class="active-btn mb-2">
        <ng-container *ngIf="item.type === 'image'">
          <img class="svg" [src]="item.icon">
        </ng-container>
        <ng-container *ngIf="item.type === 'icon'">
          <i [class]="item.icon"></i>
        </ng-container>
          <span
          *ngIf="extended"  
          class="sidebar-font-btn">
          {{ item.label }}</span>
        </button>
      }
    </div>


    <div class="">
      <button *ngIf="role === 'candidate'" 
        [ngClass]=" extended ? 'sidebar-btns-extended' : 'sidebar-btns'"
        class="active-btn mb-2">
        <i class="bi bi-gear"></i>
        <span 
        *ngIf="extended"
        class="sidebar-font-btn svg">Configuración</span>
      </button>
      <button 
      [ngClass]=" extended ? 'sidebar-btns-extended' : 'sidebar-btns'"
      class="active-btn mb-2">
        <img 
        (click)="logout()"
        class="svg" 
        src="../../../../../assets/demo/images/Administrador/Crear Quizz/Vector.png">
        <span 
        *ngIf="extended"
        class="sidebar-font-btn">Salir</span>
      </button>
    </div>
  </div>
</div>
