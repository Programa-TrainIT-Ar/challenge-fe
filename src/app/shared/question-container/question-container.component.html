<div class="question-container">
    <div class="title-component">
        <h3>Preguntas de práctica</h3>
        <div class="d-flex justify-content-between">
            <div class="question-type-input">
                <p>Preguntas de selección simple.</p>
            </div>
            <div class="counter-container">
                {{ counter | date:'mm:ss' }}
            </div>
        </div>

    </div>

    <app-question [question]="question">
    </app-question>
    <!-- <button class="next-button" (click)="updateQuestion()">
        Siguiente
    </button> -->
    <div class="button-container">
        <app-blue-button text="Siguiente" (click)="updateQuestion()">
        </app-blue-button>
    </div>
</div>
